server:
  port: 8080

spring:
  application:
    name: mini-soar-security-automation

  # Database Configuration (MySQL as primary, H2 support)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mini_soar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:soaruser}
    password: ${SPRING_DATASOURCE_PASSWORD:soarpassword}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:soaruser}
    password: ${RABBITMQ_PASSWORD:soarpassword}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 20

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

soar:
  python:
    workers-path: python_workers
    executable: python3
  security:
    api-key: ${SOAR_API_KEY:SOAR-SECRET-API-KEY-2026}
    allowed-origins: ${SOAR_ALLOWED_ORIGINS:http://localhost:8080}

logging:
  level:
    root: INFO
    com.soar.minisoar: DEBUG
    org.hibernate.SQL: WARN
